# ==============================================================================
# Kitty Terminal Configuration
# ==============================================================================

# Treat Option as Alt on macOS so Option key acts as Meta in terminal/tmux
macos_option_as_alt yes

# Explicitly map Option+Space to send Alt+Space (ESC + Space: \x1b\x20)
map alt+space send_text all \x1b\x20

# ------------------------------------------------------------------------------
# Remote Control & Sockets (Required for seamless Neovim/Kitty navigation)
# ------------------------------------------------------------------------------
allow_remote_control yes
listen_on unix:/tmp/mykitty

# ------------------------------------------------------------------------------
# Layouts
# ------------------------------------------------------------------------------
# Enable 'splits' for arbitrary horizontal/vertical splits and 'stack' for zoom
enabled_layouts splits,stack

# ------------------------------------------------------------------------------
# Window Splitting
# ------------------------------------------------------------------------------
# Cmd+/ -> Split vertically (side-by-side, inheriting current working directory)
map cmd+/      launch --location=vsplit --cwd=current
map cmd+slash  launch --location=vsplit --cwd=current

# Cmd+- -> Split horizontally (top-and-bottom, inheriting current working directory)
map cmd+-      launch --location=hsplit --cwd=current
map cmd+minus  launch --location=hsplit --cwd=current

# ------------------------------------------------------------------------------
# Tab Management
# ------------------------------------------------------------------------------
# Cmd+T -> Open new tab inheriting current working directory
map cmd+t launch --type=tab --cwd=current

# Cmd+1..9 -> Navigate directly to tab numbers
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# Tab Bar Styling (Top edge, showing index and title)
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"
active_tab_title_template "{index}: {title}"

# ------------------------------------------------------------------------------
# Window & Tab Closing
# ------------------------------------------------------------------------------
# Cmd+W -> Close active window/split (closes tab if it is the last remaining window)
map cmd+w close_window

# Cmd+Shift+W -> Close the entire tab and all its splits
map cmd+shift+w close_tab

# ------------------------------------------------------------------------------
# Seamless Navigation (Kitty Windows <-> Neovim Splits)
# ------------------------------------------------------------------------------
# Outside Neovim: navigate between neighboring Kitty windows
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right

# When Neovim is focused: pass keys through so smart-splits.nvim handles them
map --when-focus-on var:IS_NVIM ctrl+h
map --when-focus-on var:IS_NVIM ctrl+j
map --when-focus-on var:IS_NVIM ctrl+k
map --when-focus-on var:IS_NVIM ctrl+l
